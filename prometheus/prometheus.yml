global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: mock-exporter
    static_configs:
      - targets:
          - mock-exporter:9100
